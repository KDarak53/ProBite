<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparent Food Label | Scan Results</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">Pro<span class="logo-bite">BITE</span></div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link active">Home</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About Us</a></li>
            </ul>
        </div>
    </nav>

    <header>
        <h1>PRO<span>BITE</span></h1>
        <p class="tagline">Bold Flavors. Smarter Snacking.</p>
    </header>

    <main>
        <!-- Scanner Simulation Section -->
        <section id="scanner-section">
            <div class="scanner-box">
                <div class="line"></div>
                <p>Align product QR code</p>
            </div>
            <button id="scan-btn">SCAN PRODUCT</button>
        </section>

        <!-- Product Details Section (Hidden by default) -->
        <section id="product-details" class="hidden">
            
            <div class="card highlight">
                <img src="1pro.jpeg" alt="ProBite Makhana Made Better" class="product-infographic">
            </div>

            <div class="card">
                <img src="2pro.jpeg" alt="What Makes ProBite Makhana So Good" class="product-infographic">
            </div>

            <div class="card">
                <img src="3pro.jpeg" alt="Made With Organic Ingredients" class="product-infographic">
            </div>

            <div class="card">
                <img src="4pro.jpeg" alt="Nutritional Table" class="product-infographic">
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

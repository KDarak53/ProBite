<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Transparent Food Label</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">Pro<span class="logo-bite">BITE</span></div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="products.html" class="nav-link">Products</a></li>

    </nav>

    <header>
        <h1>ABOUT<span>US</span></h1>
        <p class="tagline">Bold Flavors. Smarter Snacking.</p>
    </header>

    <main class="about-main">
        <section class="about-section product-showcase">
            <div class="product-image-container">
                <img src="WhatsApp Image 2026-05-13 at 12.06.38 AM.jpeg" alt="ProBite Makhana Made Better" class="product-image">

        <section class="about-section">
            <div class="about-card gmp-card">
                <div class="about-card-header">
                    <h2>GMP-Certified Partner Facility</h2>
                    <div class="gmp-logo">
                        <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                            <!-- GMP Circle Badge -->
                            <circle cx="60" cy="60" r="55" fill="none" stroke="#2ecc71" stroke-width="2"/>
                            <circle cx="60" cy="60" r="50" fill="none" stroke="#2ecc71" stroke-width="1"/>

                            <text x="60" y="70" font-size="10" text-anchor="middle" fill="#2ecc71">CERTIFIED</text>
                            <text x="60" y="110" font-size="9" text-anchor="middle" fill="#2ecc71">MANUFACTURER</text>
                        </svg>
                    </div>
                </div>
                <div class="about-card-content">
                    <p>Our partner facility is one of the few food units in India that is GMP approved with a research lab certified by the Department of Science and Industrial Research (DSIR).</p>
                </div>
            </div>
